name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP package
        run: |
          zip -r service-monitor-${{ github.ref_name }}.zip \
            server-simple.js \
            package.json \
            public/ \
            start.bat \
            start.ps1 \
            README.md \
            LICENSE \
            .gitignore

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Service Monitor ${{ github.ref_name }}

            ### 安装使用
            1. 下载下方 `service-monitor-${{ github.ref_name }}.zip` 文件
            2. 解压后进入目录
            3. 运行 `node server-simple.js` 或双击 `start.bat`
            4. 打开浏览器访问 http://localhost:3000

            ### 功能特性
            - 🌐 HTTP URL 监控
            - 🔌 TCP 端口监控
            - 🔄 定时自动检查
            - 📊 响应时间图表
            - 📈 健康度评分
            - 🔔 Webhook 通知
            - 📤 数据导出 (JSON/CSV)
          files: service-monitor-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
