<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务状态监控面板</title>
    <script>
    // Load Chart.js with fallback
    window.chartLoaded = false;
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    script.onload = function() { window.chartLoaded = true; console.log('Chart.js loaded'); };
    script.onerror = function() { 
        console.warn('Chart.js CDN failed to load, charts will be disabled');
        window.chartLoaded = false;
    };
    document.head.appendChild(script);
</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; margin-bottom: 30px; }
        h1 { font-size: 2.5rem; background: linear-gradient(90deg, #00d9ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { color: #8892b0; font-size: 1.1rem; }
        .stats-bar { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 20px 35px; border-radius: 15px; text-align: center; backdrop-filter: blur(10px); min-width: 120px; }
        .stat-number { font-size: 2rem; font-weight: bold; }
        .stat-label { font-size: 0.9rem; color: #8892b0; margin-top: 5px; }
        .stat-online .stat-number { color: #00ff88; }
        .stat-offline .stat-number { color: #ff4757; }
        .stat-unknown .stat-number { color: #ffa502; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .control-group { display: flex; gap: 10px; align-items: center; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, #00d9ff, #0099cc); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,217,255,0.4); }
        .btn-success { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #1a1a2e; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,255,136,0.4); }
        .btn-danger { background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,71,87,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; }
        .auto-check-panel { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px 25px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .panel-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .toggle-switch { position: relative; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.2); transition: 0.4s; border-radius: 26px; }
        .toggle-slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: 0.4s; border-radius: 50%; }
        .toggle-switch input:checked + .toggle-slider { background-color: #00ff88; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(24px); }
        .interval-control { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .interval-input { width: 80px; padding: 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: rgba(255,255,255,0.1); color: white; font-size: 1rem; text-align: center; }
        .interval-input:focus { outline: none; border-color: #00d9ff; }
        .interval-label { color: #8892b0; }
        .auto-check-status { display: flex; align-items: center; gap: 10px; color: #8892b0; }
        .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: #ff4757; }
        .status-indicator.active { background: #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .charts-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .chart-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-title { font-size: 1.1rem; font-weight: 600; }
        .chart-container { position: relative; height: 250px; }
        .services-section-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .service-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; }
        .service-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .service-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .service-info { flex: 1; }
        .service-name { font-size: 1.3rem; font-weight: 600; margin-bottom: 5px; }
        .service-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .service-type { font-size: 0.8rem; color: #8892b0; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; }
        .service-uptime { font-size: 0.85rem; color: #00ff88; }
        .health-score { font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .health-excellent { background: rgba(0,255,136,0.2); color: #00ff88; }
        .health-good { background: rgba(0,217,255,0.2); color: #00d9ff; }
        .health-warning { background: rgba(255,165,2,0.2); color: #ffa502; }
        .health-critical { background: rgba(255,71,87,0.2); color: #ff4757; }
        .service-target { font-family: 'Courier New', monospace; font-size: 0.9rem; color: #00d9ff; margin: 12px 0; word-break: break-all; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .status-online { background: rgba(0,255,136,0.2); color: #00ff88; }
        .status-offline { background: rgba(255,71,87,0.2); color: #ff4757; }
        .status-unknown { background: rgba(255,165,2,0.2); color: #ffa502; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-online .status-dot { background: #00ff88; }
        .status-offline .status-dot { background: #ff4757; }
        .status-unknown .status-dot { background: #ffa502; }
        .response-time { display: flex; align-items: center; gap: 8px; margin: 12px 0; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; }
        .response-time-label { color: #8892b0; font-size: 0.85rem; }
        .response-time-value { font-weight: 600; color: #00d9ff; min-width: 60px; }
        .response-time-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .response-time-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
        .response-fast { background: #00ff88; }
        .response-medium { background: #ffa502; }
        .response-slow { background: #ff4757; }
        .status-timeline { margin: 15px 0; }
        .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .timeline-label { font-size: 0.85rem; color: #8892b0; }
        .timeline-bars { display: flex; gap: 2px; height: 24px; }
        .timeline-bar { flex: 1; min-width: 4px; border-radius: 2px; cursor: pointer; position: relative; transition: transform 0.2s; }
        .timeline-bar:hover { transform: scaleY(1.3); }
        .timeline-bar.online { background: #00ff88; }
        .timeline-bar.offline { background: #ff4757; }
        .timeline-bar.unknown { background: rgba(255,255,255,0.2); }
        .timeline-bar .tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.75rem; white-space: nowrap; z-index: 10; border: 1px solid rgba(255,255,255,0.2); }
        .timeline-bar:hover .tooltip { display: block; }
        .service-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .last-check { font-size: 0.8rem; color: #8892b0; }
        .service-actions { display: flex; gap: 8px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a2e; border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-title { font-size: 1.5rem; font-weight: 600; }
        .modal-close { background: none; border: none; color: #8892b0; font-size: 1.5rem; cursor: pointer; }
        .modal-close:hover { color: #fff; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 500; color: #8892b0; }
        .form-input { width: 100%; padding: 12px 15px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.05); color: #fff; font-size: 1rem; }
        .form-input:focus { outline: none; border-color: #00d9ff; box-shadow: 0 0 0 3px rgba(0,217,255,0.2); }
        .form-input::placeholder { color: #5a6380; }
        .form-type-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .type-option { flex: 1; padding: 12px; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .type-option:hover { border-color: rgba(255,255,255,0.2); }
        .type-option.active { border-color: #00d9ff; background: rgba(0,217,255,0.1); }
        .form-actions { display: flex; gap: 10px; margin-top: 25px; }
        .form-actions .btn { flex: 1; }
        .empty-state { text-align: center; padding: 60px 20px; color: #8892b0; }
        .empty-icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.5; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #00ff88; color: #1a1a2e; padding: 15px 25px; border-radius: 10px; font-weight: 600; box-shadow: 0 5px 20px rgba(0,255,136,0.4); transform: translateY(100px); opacity: 0; transition: all 0.3s ease; z-index: 2000; }
        .toast.active { transform: translateY(0); opacity: 1; }
        .toast.error { background: #ff4757; color: white; }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .setting-item { padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .setting-label { font-size: 0.85rem; color: #8892b0; margin-bottom: 8px; }
        .setting-value { display: flex; align-items: center; gap: 10px; }
        @media (max-width: 768px) {
            .stats-bar { gap: 15px; }
            .stat-card { padding: 15px 25px; }
            .charts-section, .services-grid { grid-template-columns: 1fr; }
            .service-header { flex-direction: column; gap: 10px; }
            .settings-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>&#9889; 服务状态监控面板</h1>
            <p class="subtitle">实时监控你的所有服务状态</p>
        </header>
        <div class="stats-bar">
            <div class="stat-card stat-online"><div class="stat-number" id="onlineCount">0</div><div class="stat-label">在线</div></div>
            <div class="stat-card stat-offline"><div class="stat-number" id="offlineCount">0</div><div class="stat-label">离线</div></div>
            <div class="stat-card stat-unknown"><div class="stat-number" id="unknownCount">0</div><div class="stat-label">未知</div></div>
        </div>
        <div class="auto-check-panel">
            <div class="panel-header">
                <div class="panel-title">&#128260; 自动检查</div>
                <label class="toggle-switch"><input type="checkbox" id="autoCheckToggle" onchange="toggleAutoCheck()"><span class="toggle-slider"></span></label>
            </div>
            <div class="controls">
                <div class="interval-control">
                    <span class="interval-label">检查间隔：</span>
                    <input type="number" class="interval-input" id="intervalInput" min="5" max="3600" value="30">
                    <span class="interval-label">秒</span>
                    <span class="interval-label" style="margin-left:15px;">并发数：</span>
                    <input type="number" class="interval-input" id="concurrencyInput" min="1" max="20" value="5">
                    <button class="btn btn-primary btn-sm" onclick="updateSettings()">保存设置</button>
                </div>
                <div class="auto-check-status">
                    <div class="status-indicator" id="autoCheckIndicator"></div>
                    <span id="autoCheckStatusText">已停止</span>
                </div>
                <div class="control-group">
                    <button class="btn btn-secondary" onclick="openSettingsModal()">&#9881; 高级设置</button>
                    <button class="btn btn-secondary" onclick="exportData()">&#128229; 导出数据</button>
                    <button class="btn btn-success" onclick="checkAllServices()">&#128260; 立即检查全部</button>
                    <button class="btn btn-primary" onclick="openModal()">&#10133; 添加服务</button>
                </div>
            </div>
        </div>
        <div class="charts-section">
            <div class="chart-card">
                <div class="chart-header"><div class="chart-title">&#128202; 响应时间趋势</div></div>
                <div class="chart-container"><canvas id="responseTimeChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-header"><div class="chart-title">&#128200; 服务健康度</div></div>
                <div class="chart-container"><canvas id="healthChart"></canvas></div>
            </div>
        </div>
        <div class="services-section-title">&#128421; 监控服务列表</div>
        <div id="servicesContainer"><div class="empty-state"><div class="empty-icon">&#128225;</div><h3>还没有监控服务</h3><p>点击"添加服务"开始监控</p></div></div>
    </div>

    <!-- Add Service Modal -->
    <div class="modal" id="addServiceModal">
        <div class="modal-content">
            <div class="modal-header"><h2 class="modal-title">添加监控服务</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
            <form id="addServiceForm" onsubmit="addService(event)">
                <div class="form-group"><label class="form-label">服务名称</label><input type="text" class="form-input" id="serviceName" placeholder="例：我的网站" required></div>
                <div class="form-group"><label class="form-label">监控类型</label>
                    <div class="form-type-selector">
                        <div class="type-option active" onclick="selectType('url')" id="typeUrl">&#127760; URL</div>
                        <div class="type-option" onclick="selectType('port')" id="typePort">&#128268; 端口</div>
                    </div>
                </div>
                <div class="form-group" id="urlInput"><label class="form-label">URL 地址</label><input type="url" class="form-input" id="serviceUrl" placeholder="https://example.com"></div>
                <div class="form-group" id="portInput" style="display:none;"><label class="form-label">主机:端口</label><input type="text" class="form-input" id="servicePort" placeholder="192.168.1.1:3306"></div>
                <div class="form-actions"><button type="button" class="btn btn-danger" onclick="closeModal()">取消</button><button type="submit" class="btn btn-primary">添加</button></div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header"><h2 class="modal-title">高级设置</h2><button class="modal-close" onclick="closeSettingsModal()">&times;</button></div>
            <div class="form-group">
                <label class="form-label">Webhook 通知 URL（服务状态变化时通知）</label>
                <input type="url" class="form-input" id="webhookUrl" placeholder="https://your-webhook-url.com/notify">
            </div>
            <div class="form-group">
                <label class="form-label">测试 Webhook</label>
                <button class="btn btn-secondary" onclick="testWebhook()">发送测试通知</button>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-danger" onclick="closeSettingsModal()">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveAdvancedSettings()">保存</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script>
        let services = [];
        let stats = [];
        let selectedType = 'url';
        let responseTimeChart = null;
        let healthChart = null;
        let chartsAvailable = false;

        document.addEventListener('DOMContentLoaded', () => {
            fetchServices();
            fetchSettings();
            initCharts();
            setInterval(() => {
                if (document.getElementById('autoCheckToggle').checked) {
                    fetchServices();
                }
            }, 5000);
        });

        async function fetchServices() {
            try {
                const response = await fetch('/api/services');
                services = await response.json();
                renderServices();
                updateStats();
                fetchStats();
            } catch (error) {
                console.error('Error fetching services:', error);
            }
        }

        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                stats = await response.json();
                updateCharts();
            } catch (error) {
                console.error('Error fetching stats:', error);
            }
        }

        async function fetchSettings() {
            try {
                const response = await fetch('/api/settings');
                const settings = await response.json();
                document.getElementById('autoCheckToggle').checked = settings.enabled;
                document.getElementById('intervalInput').value = settings.interval;
                document.getElementById('concurrencyInput').value = settings.concurrency || 5;
                document.getElementById('webhookUrl').value = settings.webhookUrl || '';
                updateAutoCheckUI(settings.enabled);
            } catch (error) {
                console.error('Error fetching settings:', error);
            }
        }

        async function toggleAutoCheck() {
            const enabled = document.getElementById('autoCheckToggle').checked;
            try {
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });
                updateAutoCheckUI(enabled);
                showToast(enabled ? '自动检查已开启' : '自动检查已关闭');
            } catch (error) {
                showToast('设置失败', true);
            }
        }

        async function updateSettings() {
            const interval = parseInt(document.getElementById('intervalInput').value);
            const concurrency = parseInt(document.getElementById('concurrencyInput').value);
            if (interval < 5 || interval > 3600) {
                showToast('间隔时间应在 5-3600 秒之间', true);
                return;
            }
            if (concurrency < 1 || concurrency > 20) {
                showToast('并发数应在 1-20 之间', true);
                return;
            }
            try {
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interval, concurrency })
                });
                showToast('设置已更新');
            } catch (error) {
                showToast('设置失败', true);
            }
        }

        async function saveAdvancedSettings() {
            const webhookUrl = document.getElementById('webhookUrl').value;
            try {
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ webhookUrl })
                });
                showToast('高级设置已保存');
                closeSettingsModal();
            } catch (error) {
                showToast('保存失败', true);
            }
        }

        async function testWebhook() {
            const webhookUrl = document.getElementById('webhookUrl').value;
            if (!webhookUrl) {
                showToast('请先输入 Webhook URL', true);
                return;
            }
            try {
                const response = await fetch('/api/webhook/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: webhookUrl })
                });
                const result = await response.json();
                if (result.success) {
                    showToast('Webhook 测试成功');
                } else {
                    showToast('Webhook 测试失败: ' + (result.error || '未知错误'), true);
                }
            } catch (error) {
                showToast('测试失败', true);
            }
        }

        function exportData() {
            window.open('/api/export?format=json', '_blank');
            showToast('数据导出中...');
        }

        function updateAutoCheckUI(enabled) {
            const indicator = document.getElementById('autoCheckIndicator');
            const statusText = document.getElementById('autoCheckStatusText');
            if (enabled) {
                indicator.classList.add('active');
                statusText.textContent = '运行中';
                statusText.style.color = '#00ff88';
            } else {
                indicator.classList.remove('active');
                statusText.textContent = '已停止';
                statusText.style.color = '#8892b0';
            }
        }

        function renderServices() {
            const container = document.getElementById('servicesContainer');
            if (services.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128225;</div><h3>还没有监控服务</h3><p>点击"添加服务"开始监控</p></div>';
                return;
            }
            container.innerHTML = '<div class="services-grid">' + services.map(service => createServiceCard(service)).join('') + '</div>';
        }

        function getHealthClass(score) {
            if (score >= 90) return 'health-excellent';
            if (score >= 70) return 'health-good';
            if (score >= 50) return 'health-warning';
            return 'health-critical';
        }

        function getHealthLabel(score) {
            if (score >= 90) return '优秀';
            if (score >= 70) return '良好';
            if (score >= 50) return '一般';
            return '较差';
        }

        function createServiceCard(service) {
            const statusClass = 'status-' + service.status;
            const typeIcon = service.type === 'url' ? '&#127760;' : '&#128268;';
            const stat = stats.find(s => s.id === service.id);
            const uptime = stat ? stat.uptime : 0;
            const avgResponse = stat ? stat.avgResponseTime : 0;
            const healthScore = stat ? stat.healthScore : 0;
            let responseClass = 'response-fast';
            if (avgResponse > 1000) responseClass = 'response-slow';
            else if (avgResponse > 500) responseClass = 'response-medium';
            const responseWidth = Math.min(100, (avgResponse / 2000) * 100);
            const history = service.history || [];
            const timelineBars = history.map(h => {
                const tooltipText = new Date(h.time).toLocaleString('zh-CN') + ' - ' + (h.status === 'online' ? '在线' : '离线') + ' (' + h.duration + 'ms)';
                return '<div class="timeline-bar ' + h.status + '" title="' + tooltipText + '"><span class="tooltip">' + tooltipText + '</span></div>';
            }).join('');
            const statusText = service.status === 'online' ? '在线' : service.status === 'offline' ? '离线' : '未知';
            return '<div class="service-card"><div class="service-header"><div class="service-info"><div class="service-name">' + escapeHtml(service.name) + '</div><div class="service-meta"><span class="service-type">' + typeIcon + ' ' + service.type.toUpperCase() + '</span><span class="service-uptime">可用率 ' + uptime + '%</span><span class="health-score ' + getHealthClass(healthScore) + '">健康度 ' + healthScore + ' - ' + getHealthLabel(healthScore) + '</span></div></div><span class="status-badge ' + statusClass + '"><span class="status-dot"></span>' + statusText + '</span></div><div class="service-target">' + escapeHtml(service.target) + '</div><div class="response-time"><span class="response-time-label">响应时间</span><span class="response-time-value">' + avgResponse + 'ms</span><div class="response-time-bar"><div class="response-time-fill ' + responseClass + '" style="width: ' + responseWidth + '%"></div></div></div><div class="status-timeline"><div class="timeline-header"><span class="timeline-label">状态历史（最近 ' + history.length + ' 次）</span></div><div class="timeline-bars">' + (timelineBars || '<div class="timeline-bar unknown"></div>'.repeat(10)) + '</div></div><div class="service-footer"><span class="last-check">' + (service.lastCheck ? '上次检查: ' + formatTime(service.lastCheck) : '尚未检查') + '</span><div class="service-actions"><button class="btn btn-sm btn-primary" onclick="checkService(' + service.id + ')">&#128269; 检查</button><button class="btn btn-sm btn-danger" onclick="deleteService(' + service.id + ')">&#128465; 删除</button></div></div></div>';
        }

        function updateStats() {
            document.getElementById('onlineCount').textContent = services.filter(s => s.status === 'online').length;
            document.getElementById('offlineCount').textContent = services.filter(s => s.status === 'offline').length;
            document.getElementById('unknownCount').textContent = services.filter(s => s.status === 'unknown').length;
        }
        function initCharts() {
            if (!window.chartLoaded) {
                console.warn('Chart.js not loaded, charts disabled');
                document.getElementById('responseTimeChart').parentElement.innerHTML = '<div style="text-align:center;padding:50px;color:#8892b0;">图表功能需要网络连接加载 Chart.js</div>';
                document.getElementById('healthChart').parentElement.innerHTML = '<div style="text-align:center;padding:50px;color:#8892b0;">图表功能需要网络连接加载 Chart.js</div>';
                return;
            }
            chartsAvailable = true;
            const rtCtx = document.getElementById('responseTimeChart').getContext('2d');
            responseTimeChart = new Chart(rtCtx, {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#8892b0' } } }, scales: { x: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(255,255,255,0.1)' } }, y: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(255,255,255,0.1)' }, title: { display: true, text: '响应时间 (ms)', color: '#8892b0' } } } }
            });
            const healthCtx = document.getElementById('healthChart').getContext('2d');
            healthChart = new Chart(healthCtx, {
                type: 'radar',
                data: { labels: [], datasets: [] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#8892b0' } } }, scales: { r: { grid: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { color: '#8892b0' }, ticks: { color: '#8892b0', backdropColor: 'transparent' }, min: 0, max: 100 } } }
            });
        }

        function updateCharts() {
            if (!responseTimeChart || !healthChart) return;
            if (services.length === 0) return;
            const labels = services.map(s => s.name);
            const responseData = services.map(s => { const stat = stats.find(st => st.id === s.id); return stat ? stat.avgResponseTime : 0; });
            responseTimeChart.data.labels = labels;
            responseTimeChart.data.datasets = [{ label: '平均响应时间 (ms)', data: responseData, borderColor: '#00d9ff', backgroundColor: 'rgba(0,217,255,0.2)', tension: 0.4, fill: true }];
            responseTimeChart.update();
            const healthData = services.map(s => { const stat = stats.find(st => st.id === s.id); return stat ? stat.healthScore : 0; });
            const uptimeData = services.map(s => { const stat = stats.find(st => st.id === s.id); return stat ? stat.uptime : 0; });
            const responseData2 = services.map(s => { const stat = stats.find(st => st.id === s.id); return stat ? Math.min(100, 100 - (stat.avgResponseTime / 20)) : 100; });
            healthChart.data.labels = ['可用率', '响应速度', '健康度'];
            healthChart.data.datasets = labels.map((name, i) => ({
                label: name,
                data: [uptimeData[i], responseData2[i], healthData[i]],
                borderColor: ['#00ff88', '#00d9ff', '#ffa502'][i % 3],
                backgroundColor: ['rgba(0,255,136,0.2)', 'rgba(0,217,255,0.2)', 'rgba(255,165,2,0.2)'][i % 3],
                borderWidth: 2
            }));
            healthChart.update();
        }

        function selectType(type) {
            selectedType = type;
            document.getElementById('typeUrl').classList.toggle('active', type === 'url');
            document.getElementById('typePort').classList.toggle('active', type === 'port');
            document.getElementById('urlInput').style.display = type === 'url' ? 'block' : 'none';
            document.getElementById('portInput').style.display = type === 'port' ? 'block' : 'none';
        }

        function openModal() {
            document.getElementById('addServiceModal').classList.add('active');
            document.getElementById('addServiceForm').reset();
            selectType('url');
        }

        function closeModal() {
            document.getElementById('addServiceModal').classList.remove('active');
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        async function addService(event) {
            event.preventDefault();
            const name = document.getElementById('serviceName').value;
            const data = { name };
            if (selectedType === 'url') { data.url = document.getElementById('serviceUrl').value; }
            else { data.port = document.getElementById('servicePort').value; }
            try {
                const response = await fetch('/api/services', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                if (response.ok) { showToast('服务添加成功！'); closeModal(); fetchServices(); }
                else { const error = await response.json(); showToast(error.error || '添加失败', true); }
            } catch (error) { showToast('添加失败', true); }
        }

        async function checkService(id) {
            try {
                const response = await fetch('/api/check/' + id);
                if (response.ok) { fetchServices(); showToast('服务检查完成'); }
            } catch (error) { showToast('检查失败', true); }
        }

        async function checkAllServices() {
            try {
                const response = await fetch('/api/check-all');
                if (response.ok) { services = await response.json(); renderServices(); updateStats(); fetchStats(); showToast('全部服务检查完成'); }
            } catch (error) { showToast('检查失败', true); }
        }

        async function deleteService(id) {
            if (!confirm('确定要删除这个服务吗？')) return;
            try {
                const response = await fetch('/api/services/' + id, { method: 'DELETE' });
                if (response.ok) { showToast('服务已删除'); fetchServices(); }
            } catch (error) { showToast('删除失败', true); }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('active');
            setTimeout(() => { toast.classList.remove('active'); }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(isoString) {
            return new Date(isoString).toLocaleString('zh-CN');
        }
    </script>
</body>
</html>
